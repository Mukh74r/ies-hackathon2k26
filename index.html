<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <title>DeepHubAI | Innovation Redefined</title>
    <meta
      name="description"
      content="We build the future through innovative technology solutions. Discover our story."
    />
    <meta name="author" content="DeepHubAI" />

    <meta property="og:title" content="DeepHubAI | Innovation Redefined" />
    <meta
      property="og:description"
      content="We build the future through innovative technology solutions."
    />
    <meta property="og:type" content="website" />

    <!-- Preload placeholder Removed for hash consistency -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Non-render-blocking Google Fonts (preload trick) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      />
    </noscript>

    <!-- Deferred Non-Critical CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
      crossorigin="anonymous"
      id="katex-css"
      media="print"
    />
    <script>
      document
        .getElementById("katex-css")
        .addEventListener("load", function () {
          this.media = "all";
        });
      // Fallback in case load event already fired or fails
      setTimeout(function () {
        var k = document.getElementById("katex-css");
        if (k) k.media = "all";
      }, 2000);
    </script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      />
    </noscript>
    <!-- Critical CSS -->
    <style>
      :root {
        --background: 0 0% 0%;
        --foreground: 0 0% 100%;
        font-family: "Outfit", sans-serif;
      }
      html,
      body {
        background-color: #000;
        color: #fff;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: #000;
      }
      /* Pre-style for the dark themed app */
      .bg-background {
        background-color: hsl(0 0% 0%);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
