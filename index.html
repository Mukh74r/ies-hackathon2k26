<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <title>DeepHubAI | Innovation Redefined</title>
    <meta
      name="description"
      content="We build the future through innovative technology solutions. Discover our story."
    />
    <meta name="author" content="DeepHubAI" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="keywords"
      content="DeepHub AI, Curriculum Architecture, Examination Platform, Question Paper Generator, CBSE, ICSE, Indian Education AI"
    />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="DeepHubAI | Innovation Redefined" />
    <meta
      property="og:description"
      content="We build the future through innovative technology solutions."
    />
    <meta property="og:site_name" content="DeepHubAI" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Google Fonts: Inter, Outfit, Plus Jakarta Sans, Space Mono -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      />
    </noscript>

    <!-- Deferred KaTeX Stylesheet -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
      crossorigin="anonymous"
      id="katex-css"
      media="print"
    />
    <script>
      document
        .getElementById("katex-css")
        .addEventListener("load", function () {
          this.media = "all";
        });
      setTimeout(function () {
        var k = document.getElementById("katex-css");
        if (k) k.media = "all";
      }, 2000);
    </script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      />
    </noscript>

    <!-- Critical Base CSS: Exact DeepHubAI Dark Theme -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      :root {
        --background: #000000;
        --surface: #0A0E1A;
        --foreground: #FFFFFF;
        --text: #FFFFFF;
        --primary: #FF9900;
        --accent: #00A4E4;
        --border: #1E2640;
        font-family: "Outfit", "Inter", sans-serif;
      }

      html {
        scroll-behavior: smooth;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #000000;
        color: #FFFFFF;
      }

      body {
        background-color: #000000;
        color: #FFFFFF;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        font-family: "Outfit", "Inter", -apple-system, sans-serif;
        line-height: 1.55;
      }

      h1, h2, h3, h4, h5, h6, .font-display {
        font-family: "Outfit", "Plus Jakarta Sans", sans-serif;
        font-weight: 700;
        color: #FFFFFF;
      }

      .font-mono, .font-mono-stamp, .mark-badge, .analytics-num {
        font-family: "Space Mono", ui-monospace, SFMono-Regular, monospace;
      }

      #root {
        min-height: 100vh;
        background-color: #000000;
      }

      .bg-background {
        background-color: #000000;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
